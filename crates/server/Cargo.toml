[package]
name = "server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "z3-map-rando-server"
path = "src/main.rs"

[build-dependencies]
anyhow = "1"
catalog_builder = { path = "../catalog_builder" }

[dependencies]
retiling_catalog = { path = "../retiling_catalog" }
actix-files = "0.6"
actix-web = { version = "4", default-features = false, features = ["macros"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
generator = { path = "../generator" }
log = "0.4"
logic_catalog = { path = "../logic_catalog" }
object_store = { version = "0.14", features = ["aws"] }
preset_catalog = { path = "../preset_catalog" }
rand = "0.9"
seed_data = { path = "../seed_data" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
toml = "0.9"
url = "2"
zstd = { version = "0.13", default-features = false }
