[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "z3-map-rando"
path = "src/main.rs"

[features]
bundle-catalogs = ["dep:catalog_builder"]

[build-dependencies]
catalog_builder = { path = "../catalog_builder", optional = true }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
common_types = { path = "../common_types" }
generator = { path = "../generator" }
logic_catalog = { path = "../logic_catalog" }
patch_catalog = { path = "../patch_catalog" }
patcher = { path = "../patcher" }
rand = "0.9"
retiling_catalog = { path = "../retiling_catalog" }
seed_data = { path = "../seed_data" }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
